# Contributor License Agreement check (contributor-assistant action).
# Disabled until the CLA text is reviewed and finalized: set the repository
# variable CLA_ENABLED=true and add a PERSONAL_ACCESS_TOKEN secret to enable it.
# Signatures are stored in signatures/cla.json on the `cla-signatures` branch.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      vars.CLA_ENABLED == 'true' &&
      (github.event_name == 'pull_request_target' ||
       github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: nebulaw,dependabot[bot],github-actions[bot],bot*
