name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Software GPU for livspeil-ui-render/-shot tests: lavapipe (Vulkan)
      # on Linux. macOS runners use Metal. Without any adapter the GPU tests
      # skip with a message; the CPU reference goldens always run.
      - name: Install software Vulkan (lavapipe)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: UI screenshots (CPU reference and GPU)
        run: cargo xtask shot --gpu
      - name: Upload UI screenshots and golden diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots-${{ matrix.os }}
          path: target/shots/
          if-no-files-found: ignore
      # The CLI without wasmtime (feature `wasm` off) still builds.
      - run: cargo check -p livspeil-cli --no-default-features

  msrv:
    name: MSRV (Rust 1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
