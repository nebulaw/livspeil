# Checks that every commit in a pull request carries a Signed-off-by trailer
# (Developer Certificate of Origin, see CONTRIBUTING.md). Bots are exempt.
# Maintainers can also install the DCO2 GitHub app instead of this workflow.

name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on all PR commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author_email=$(git log -1 --format='%ae' "$sha")
            case "$author_email" in
              *"[bot]@users.noreply.github.com") continue ;;
            esac
            if ! git log -1 --format='%B' "$sha" | grep -Eq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $sha is missing a Signed-off-by line"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Fix with: git rebase --signoff origin/main && git push --force-with-lease"
            exit 1
          fi
