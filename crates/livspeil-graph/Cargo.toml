[package]
name = "livspeil-graph"
description = "Networks, nodes, links, type checking and the cook scheduler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Serde derives for ids, links and snapshots (journals, documents).
serde = ["dep:serde", "uuid/serde", "livspeil-node-api/serde"]

[dependencies]
livspeil-node-api = { path = "../livspeil-node-api" }
serde = { version = "1", features = ["derive"], optional = true }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
livspeil-nodes-core = { path = "../livspeil-nodes-core" }
livspeil-testkit = { path = "../livspeil-testkit" }

[lints]
workspace = true
