[package]
name = "livspeil-ui-render"
description = "Livspeil UI renderer: display list, wgpu backend, CPU reference rasterizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MPL-2.0"
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# Metal (macOS), Vulkan and GLES/EGL (Linux, incl. lavapipe/llvmpipe); no
# DX12 or WebGPU backends.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "vulkan", "gles"] }
pollster = "1"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "quads"
harness = false

[lints]
workspace = true
