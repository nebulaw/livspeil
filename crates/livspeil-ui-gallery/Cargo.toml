[package]
name = "livspeil-ui-gallery"
description = "Livspeil UI component gallery: every widget, material, type and motion setting, live"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MPL-2.0"
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
livspeil-ui-core = { path = "../livspeil-ui-core" }
livspeil-ui-layout = { path = "../livspeil-ui-layout" }
livspeil-ui-text = { path = "../livspeil-ui-text" }
livspeil-ui-theme = { path = "../livspeil-ui-theme" }
livspeil-ui-widgets = { path = "../livspeil-ui-widgets" }
# The windowed app (feature `app`); the pages library is headless.
livspeil-ui-host-winit = { path = "../livspeil-ui-host-winit", optional = true }
livspeil-ui-paint = { path = "../livspeil-ui-paint", optional = true }
log = "0.4"

[dev-dependencies]
livspeil-ui-a11y = { path = "../livspeil-ui-a11y" }
livspeil-ui-paint = { path = "../livspeil-ui-paint" }

[features]
default = ["app"]
app = ["dep:livspeil-ui-host-winit", "dep:livspeil-ui-paint"]

[[bin]]
name = "livspeil-ui-gallery"
path = "src/main.rs"
required-features = ["app"]

[lints]
workspace = true
