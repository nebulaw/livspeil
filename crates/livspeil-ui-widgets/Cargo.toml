[package]
name = "livspeil-ui-widgets"
description = "Livspeil UI widgets: controls, fields, select, tooltip, scroll views, docks, menus, titlebar, node canvas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MPL-2.0"
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
livspeil-ui-core = { path = "../livspeil-ui-core" }
livspeil-ui-layout = { path = "../livspeil-ui-layout" }
livspeil-ui-text = { path = "../livspeil-ui-text" }
livspeil-ui-theme = { path = "../livspeil-ui-theme" }

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
livspeil-testkit = { path = "../livspeil-testkit" }
proptest = "1"

[[bench]]
name = "node_canvas"
harness = false

[lints]
workspace = true
