[package]
name = "livspeil-doc"
description = "Document model, KDL serialization, migrations and asset references"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# KDL v2 parser (Apache-2.0).
kdl = "6.7"
livspeil-graph = { path = "../livspeil-graph" }
livspeil-node-api = { path = "../livspeil-node-api" }
livspeil-params = { path = "../livspeil-params" }
# SHA-256 of room assets (MIT OR Apache-2.0); default features (std) are
# not needed.
sha2 = { version = "0.10", default-features = false }
uuid = "1"

[dev-dependencies]
livspeil-nodes-core = { path = "../livspeil-nodes-core" }
livspeil-testkit = { path = "../livspeil-testkit" }
proptest = "1"

[lints]
workspace = true
