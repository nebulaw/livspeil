[package]
name = "livspeil-node-api"
description = "Public node and Charm API surface (NodeSpec, port types)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MPL-2.0"
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Serde derives for `PortType` and `Value` (journals, documents).
serde = ["dep:serde"]

[dependencies]
# `rc`: `Value::Curve` holds an `Arc` (serialized by content).
serde = { version = "1", features = ["derive", "rc"], optional = true }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
