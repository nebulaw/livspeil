[package]
name = "livspeil-cmd"
description = "Command bus, transactions, undo/redo and the journal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
livspeil-graph = { path = "../livspeil-graph", features = ["serde"] }
livspeil-node-api = { path = "../livspeil-node-api", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse floats back bit-exactly so a replayed journal
# reproduces the original values.
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
livspeil-nodes-core = { path = "../livspeil-nodes-core" }
proptest = "1"
uuid = "1"

[[bench]]
name = "history"
harness = false

[lints]
workspace = true
