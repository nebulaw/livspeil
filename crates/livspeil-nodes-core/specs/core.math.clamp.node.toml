#
# Node spec (kernel spec, section 9). The keys and ports above the first
# [[tests]] are generated from the Rust NodeSpec by `cargo xtask node-specs`
# and checked by crates/livspeil-nodes-core/tests/node_specs.rs; only
# `description` and the [[tests]] are hand-written. Format: docs/nodes.md.

id = "core.math.clamp"
version = 1
summary = "Limit x to the range [min, max] (bounds are swapped if reversed)"
time_dependent = false
reads_system = false
description = '''
Limits `x` to `[min, max]`. If `min > max` the bounds are swapped, so the
node never fails and the order in which the two sliders are dragged does
not matter. A `NaN` `x` passes through; a `NaN` bound is ignored (that side
is unbounded).
'''

[[inputs]]
name = "x"
type = "Float"
default = 0.0

[[inputs]]
name = "min"
type = "Float"
default = 0.0

[[inputs]]
name = "max"
type = "Float"
default = 1.0

[[outputs]]
name = "out"
type = "Float"

[[tests]]
inputs = { x = 0.25 }
expect = { out = 0.25 }

[[tests]]
inputs = { x = -2.0 }
expect = { out = 0.0 }

[[tests]]
name = "swapped bounds"
inputs = { x = 3.0, min = 1.0, max = -1.0 }
expect = { out = 1.0 }

[[tests]]
name = "NaN bound is ignored"
inputs = { x = -5.0, min = nan, max = 1.0 }
expect = { out = -5.0 }
