#
# Node spec (kernel spec, section 9). The keys and ports above the first
# [[tests]] are generated from the Rust NodeSpec by `cargo xtask node-specs`
# and checked by crates/livspeil-nodes-core/tests/node_specs.rs; only
# `description` and the [[tests]] are hand-written. Format: docs/nodes.md.

id = "core.math.div"
version = 1
summary = "Divide a by b (b must not be zero)"
time_dependent = false
reads_system = false
description = '''
`out = a / b`. A zero `b` (either sign) is an invalid-input error on `b`,
so the scheduler keeps the last good output instead of publishing an
infinity or `NaN`. Any other divisor follows IEEE 754 (`a / inf == 0`, a
`NaN` operand gives `NaN`).
'''

[[inputs]]
name = "a"
type = "Float"
default = 0.0

[[inputs]]
name = "b"
type = "Float"
default = 1.0

[[outputs]]
name = "out"
type = "Float"

[[tests]]
inputs = { a = 7.0, b = 2.0 }
expect = { out = 3.5 }

[[tests]]
inputs = { a = 1.0, b = 3.0 }
expect = { out = 0.3333333333333333 }

[[tests]]
name = "division by zero"
inputs = { a = 1.0, b = 0.0 }
expect_error = { port = "b", message = "division by zero" }

[[tests]]
name = "division by negative zero"
inputs = { a = 1.0, b = -0.0 }
expect_error = { port = "b" }

[[tests]]
inputs = { a = 1.0, b = inf }
expect = { out = 0.0 }
