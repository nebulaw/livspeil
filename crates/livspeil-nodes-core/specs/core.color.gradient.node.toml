#
# Node spec (kernel spec, section 9). The keys and ports above the first
# [[tests]] are generated from the Rust NodeSpec by `cargo xtask node-specs`
# and checked by crates/livspeil-nodes-core/tests/node_specs.rs; only
# `description` and the [[tests]] are hand-written. Format: docs/nodes.md.

id = "core.color.gradient"
version = 1
summary = "Three-stop OKLCH gradient (c0 at 0, c1 at p1, c2 at 1) sampled at t, mixed in OKLab"
time_dependent = false
reads_system = false
description = '''
Three-stop OKLCH gradient: `c0` at 0, `c1` at `p1` and `c2` at 1, sampled
at `t` (clamped to `[0, 1]`; `p1` too) and mixed in OKLab as in
`core.color.mix`. The number of stops is fixed at three for now. A `NaN`
or infinite `t`, `p1` or color component is an invalid-input error.
'''

[[inputs]]
name = "t"
type = "Float"
default = 0.5

[[inputs]]
name = "c0"
type = "Color"
default = [0.3, 0.1, 270.0, 1.0]

[[inputs]]
name = "c1"
type = "Color"
default = [0.7, 0.15, 45.0, 1.0]

[[inputs]]
name = "c2"
type = "Color"
default = [0.95, 0.05, 95.0, 1.0]

[[inputs]]
name = "p1"
type = "Float"
default = 0.5

[[outputs]]
name = "out"
type = "Color"

[[tests]]
name = "defaults: the middle stop"
expect = { out = [0.7, 0.15, 45.0, 1.0] }

[[tests]]
inputs = { t = 0.25 }
expect = { out = [0.5, 0.05312, 3.273235, 1.0] }
tolerance = 1e-6

[[tests]]
name = "moved middle stop"
inputs = { t = 0.1, p1 = 0.2 }
expect = { out = [0.5, 0.05312, 3.273235, 1.0] }
tolerance = 1e-6

[[tests]]
inputs = { t = nan }
expect_error = { port = "t" }
