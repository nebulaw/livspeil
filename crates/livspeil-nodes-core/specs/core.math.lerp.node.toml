#
# Node spec (kernel spec, section 9). The keys and ports above the first
# [[tests]] are generated from the Rust NodeSpec by `cargo xtask node-specs`
# and checked by crates/livspeil-nodes-core/tests/node_specs.rs; only
# `description` and the [[tests]] are hand-written. Format: docs/nodes.md.

id = "core.math.lerp"
version = 1
summary = "Linear interpolation between a and b"
time_dependent = false
reads_system = false
description = '''
`out = a + (b - a) * t`, not clamped: `t` outside `[0, 1]` extrapolates.
'''

[[inputs]]
name = "a"
type = "Float"
default = 0.0

[[inputs]]
name = "b"
type = "Float"
default = 1.0

[[inputs]]
name = "t"
type = "Float"
default = 0.5

[[outputs]]
name = "out"
type = "Float"

[[tests]]
name = "spec example"
inputs = { a = 0.0, b = 10.0, t = 0.25 }
expect = { out = 2.5 }

[[tests]]
name = "not clamped"
inputs = { a = 0.0, b = 10.0, t = 2.0 }
expect = { out = 20.0 }

[[tests]]
name = "defaults"
expect = { out = 0.5 }
