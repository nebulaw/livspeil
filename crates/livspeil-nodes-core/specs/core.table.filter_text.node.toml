#
# Node spec (kernel spec, section 9). The keys and ports above the first
# [[tests]] are generated from the Rust NodeSpec by `cargo xtask node-specs`
# and checked by crates/livspeil-nodes-core/tests/node_specs.rs; only
# `description` and the [[tests]] are hand-written. Format: docs/nodes.md.

id = "core.table.filter_text"
version = 1
summary = "Keep the rows whose text column contains a substring"
time_dependent = false
reads_system = false
description = '''
The rows of `table` whose String column `column` contains `text` (the
empty text keeps every row), in their original order; `count` is the
number of rows kept. With `ignore_case` both sides are lowercased first
(Unicode). A column that is not a String column is an invalid-input error.
'''

[[inputs]]
name = "table"
type = "Table"
default = { columns = [] }

[[inputs]]
name = "column"
type = "String"
default = "name"

[[inputs]]
name = "text"
type = "String"
default = ""

[[inputs]]
name = "ignore_case"
type = "Bool"
default = false

[[outputs]]
name = "out"
type = "Table"

[[outputs]]
name = "count"
type = "Int"

[[tests]]
expect = { count = 1, out = { columns = [{ name = "tag", type = "String", values = ["sci-fi"] }] } }

[tests.inputs]
column = "tag"
text = "sci"

[[tests.inputs.table.columns]]
name = "tag"
type = "String"
values = ["sci-fi", "classic", "Sci-Fi", ""]

[[tests]]
name = "ignore case"
expect = { count = 2, out = { columns = [{ name = "tag", type = "String", values = ["sci-fi", "Sci-Fi"] }] } }

[tests.inputs]
column = "tag"
text = "sci"
ignore_case = true

[[tests.inputs.table.columns]]
name = "tag"
type = "String"
values = ["sci-fi", "classic", "Sci-Fi", ""]

[[tests]]
name = "empty text keeps every row"
expect = { count = 4 }

[tests.inputs]
column = "tag"

[[tests.inputs.table.columns]]
name = "tag"
type = "String"
values = ["sci-fi", "classic", "Sci-Fi", ""]

[[tests]]
expect_error = { port = "column", message = "needs a String column" }

[tests.inputs]
column = "pages"

[[tests.inputs.table.columns]]
name = "name"
type = "String"
values = ["Dune", "Emma", "dracula", "Ubik", "Émile"]

[[tests.inputs.table.columns]]
name = "pages"
type = "Int"
values = [412, 474, 418, 202, 412]

[[tests.inputs.table.columns]]
name = "rating"
type = "Float"
values = [4.5, 3.75, -0.0, nan, 0.0]

[[tests.inputs.table.columns]]
name = "read"
type = "Bool"
values = [true, false, true, false, false]
