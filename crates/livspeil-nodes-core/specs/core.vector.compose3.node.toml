#
# Node spec (kernel spec, section 9). The keys and ports above the first
# [[tests]] are generated from the Rust NodeSpec by `cargo xtask node-specs`
# and checked by crates/livspeil-nodes-core/tests/node_specs.rs; only
# `description` and the [[tests]] are hand-written. Format: docs/nodes.md.

id = "core.vector.compose3"
version = 1
summary = "Build a Vec3 from x, y and z"
time_dependent = false
reads_system = false

[[inputs]]
name = "x"
type = "Float"
default = 0.0

[[inputs]]
name = "y"
type = "Float"
default = 0.0

[[inputs]]
name = "z"
type = "Float"
default = 0.0

[[outputs]]
name = "out"
type = "Vec3"

[[tests]]
name = "defaults"
expect = { out = [0.0, 0.0, 0.0] }

[[tests]]
inputs = { x = 1.5, y = -0.0, z = nan }
expect = { out = [1.5, -0.0, nan] }
