[package]
name = "livspeil-nodes-core"
description = "The first built-in nodes (math, time, color, logic, events, fs)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
livspeil-node-api = { path = "../livspeil-node-api" }
# Curve sampling shares the animation-channel implementation (M0.8).
livspeil-params = { path = "../livspeil-params" }

[dev-dependencies]
livspeil-testkit = { path = "../livspeil-testkit" }
# Parses the `specs/*.node.toml` files (tests/node_specs.rs, examples/dump-specs.rs).
toml = { version = "1.2.2", default-features = false, features = ["std", "parse", "serde"] }

