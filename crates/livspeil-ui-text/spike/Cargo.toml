# Text stack spike (M1.2): Parley vs cosmic-text. Standalone on purpose (own
# workspace) so the losing stack never enters the main Cargo.lock or the
# cargo-deny graph. Run with:
#   cargo run --release --manifest-path crates/livspeil-ui-text/spike/Cargo.toml
# Findings: docs/decisions/ui-text-stack.md.

[package]
name = "ui-text-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
publish = false

[workspace]

[dependencies]
parley = "0.13"
skrifa = "0.49"
zeno = "0.3"
cosmic-text = "0.19"
