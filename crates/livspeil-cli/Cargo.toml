[package]
name = "livspeil-cli"
description = "Headless command line: cook, validate, fmt, diff, run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "livspeil"
path = "src/main.rs"

[features]
# `cook --wasm` (sandboxed WebAssembly node packages, wasmtime). On by
# default; it needs Rust 1.86. `--no-default-features` builds on the
# workspace MSRV (1.85) without wasmtime, and `--wasm` then fails.
default = ["wasm"]
wasm = ["dep:livspeil-wasm-host"]

[dependencies]
livspeil-cmd = { path = "../livspeil-cmd" }
livspeil-doc = { path = "../livspeil-doc" }
livspeil-graph = { path = "../livspeil-graph" }
livspeil-node-api = { path = "../livspeil-node-api" }
livspeil-nodes-core = { path = "../livspeil-nodes-core" }
livspeil-script = { path = "../livspeil-script" }
# Optional (feature `wasm`): needs Rust 1.86 through wasmtime.
livspeil-wasm-host = { path = "../livspeil-wasm-host", optional = true }
serde_json = "1"

[dev-dependencies]
livspeil-testkit = { path = "../livspeil-testkit" }

[lints]
workspace = true
