[package]
name = "livspeil-wasm-host"
description = "Sandboxed WebAssembly node packages (third-party Charms in process)"
version.workspace = true
edition.workspace = true
# wasmtime is pinned to an LTS line (48.x, supported for two years, MSRV
# 1.95). See docs/wasm-nodes.md.
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
livspeil-node-api = { path = "../livspeil-node-api" }
sha2 = { version = "0.10", default-features = false }
# Core modules only: no component model, WASI, async, GC, threads, disk
# cache or parallel compilation. `wat` lets packages be loaded from text.
wasmtime = { version = "=48.0.10", default-features = false, features = ["runtime", "cranelift", "std", "wat"] }

[dev-dependencies]
livspeil-doc = { path = "../livspeil-doc" }
livspeil-graph = { path = "../livspeil-graph" }
livspeil-nodes-core = { path = "../livspeil-nodes-core" }
wat = "1"

[lints]
workspace = true
