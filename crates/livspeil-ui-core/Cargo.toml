[package]
name = "livspeil-ui-core"
description = "Livspeil UI core: models, views, element diffing, input, focus, animation driver, frame loop, paint list"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MPL-2.0"
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
livspeil-ui-layout = { path = "../livspeil-ui-layout" }
livspeil-ui-theme = { path = "../livspeil-ui-theme" }
serde = { version = "1", features = ["derive"] }
toml = { version = "1.2.2", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
livspeil-testkit = { path = "../livspeil-testkit" }

[lints]
workspace = true
