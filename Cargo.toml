[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/nebulaw/livspeil"
authors = ["Livspeil contributors"]
publish = false

# Debug builds stay usable: dependencies (shaping, rasterizing, layout, the
# GPU layer) are optimized; only this workspace's code is unoptimized.
[profile.dev.package."*"]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
