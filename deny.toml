[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "GPL-3.0-or-later",
  "LGPL-3.0-or-later",   # allowed for dependencies only
  "MPL-2.0",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",             # permissive, FSF-free, GPL/MPL-compatible; clipboard-win (arboard on Windows)
  "Unicode-3.0",
  "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
