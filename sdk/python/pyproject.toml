[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "livspeil"
version = "0.0.0"
description = "Python SDK for Livspeil scripts: talk to the kernel over the script worker protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MPL-2.0" }
authors = [{ name = "Livspeil contributors" }]
classifiers = [
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = []

[tool.setuptools]
packages = ["livspeil"]

[tool.setuptools.package-data]
livspeil = ["py.typed"]
