version = 1
SPDX-PackageName = "livspeil"
SPDX-PackageDownloadLocation = "https://github.com/nebulaw/livspeil"

[[annotations]]
path = ["Cargo.lock", ".gitignore", ".editorconfig", "rust-toolchain.toml", ".cargo/config.toml", "REUSE.toml", "deny.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Livspeil contributors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [".github/**", "crates/**/tests/golden/**", "crates/**/specs/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Livspeil contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = [".claude/**", "README.md", "CONTRIBUTING.md", "CLAUDE.md", "TRADEMARKS.md", "CLA.md", "specs/**", "docs/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Livspeil contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["LICENSE"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc. <https://fsf.org/>"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["examples/*.room/assets/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Livspeil contributors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["examples/wasm/**/*.wasm"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Livspeil contributors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["sdk/python/livspeil/py.typed"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Livspeil contributors"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = ["assets/fonts/inter/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["assets/fonts/noto-sans-georgian/**", "assets/fonts/noto-sans-arabic/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2022 The Noto Project Authors (https://github.com/notofonts)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["crates/livspeil-ui-text/tests/golden/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Livspeil contributors"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = ["crates/livspeil-ui-text/spike/Cargo.lock"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Livspeil contributors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["crates/livspeil-dream/goldens/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Livspeil contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["crates/livspeil-ui-*/goldens/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Livspeil contributors"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = ["assets/icons/boxicons/*.svg", "assets/icons/boxicons/LICENSE.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Boxicons (https://boxicons.com)"
SPDX-License-Identifier = "CC-BY-4.0"
